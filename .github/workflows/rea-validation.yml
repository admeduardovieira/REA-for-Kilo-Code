name: REA Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile('scripts/validate-fork.ps1', [ref]$null, [ref]$null) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'PowerShell syntax OK'
      - name: Run structure tests
        shell: pwsh
        run: .\tests\test_structure.ps1
      - name: Run script tests
        shell: pwsh
        run: .\tests\test_script.ps1
      - name: Check pre-push hook
        shell: bash
        run: |
          if [ ! -f .githooks/pre-push ]; then echo 'pre-push missing'; exit 1; fi
          grep -q 'validate-fork.ps1' .githooks/pre-push || { echo 'pre-push missing validator'; exit 1; }

